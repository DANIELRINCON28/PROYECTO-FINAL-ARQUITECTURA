{% extends "base.html" %}

{% block title %}500 - Error del Servidor{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3 text-center py-5">
        <i class="fas fa-server fa-5x text-danger mb-4"></i>
        <h1 class="display-1">500</h1>
        <h2>Error Interno del Servidor</h2>
        <p class="lead text-muted">
            Ocurrió un error inesperado. Nuestro equipo ha sido notificado y está trabajando en solucionarlo.
        </p>
        <hr>
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
            <i class="fas fa-home"></i> Volver al Inicio
        </a>
    </div>
</div>
{% endblock %}
